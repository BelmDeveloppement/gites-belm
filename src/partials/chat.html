<!-- CHATBOT -->
<div class="chat" id="chat">
  <button class="chat-fab" id="chatFab" aria-expanded="false" aria-controls="chatPanel" data-i18n-attr="aria-label:chat.open" aria-label="Ouvrir l'assistant">
    <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path fill="currentColor" d="M4 4h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H9l-5 4v-4H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Z"/></svg>
  </button>
  <section class="chat-panel" id="chatPanel" role="dialog" aria-label="Assistant" hidden>
    <header><b data-i18n="chat.title">Assistant BEL'M</b><button id="chatClose" aria-label="Fermer" data-i18n-attr="aria-label:chat.close">✕</button></header>
    <div class="chat-log" id="chatLog" aria-live="polite"></div>
    <div class="chat-quick" id="chatQuick"></div>
    <form class="chat-form" id="chatForm" autocomplete="off">
      <input id="chatInput" type="text" data-i18n-attr="placeholder:chat.placeholder" placeholder="Posez votre question…" aria-label="Message">
      <button type="submit" data-i18n-attr="aria-label:chat.send" aria-label="Envoyer">➤</button>
    </form>
  </section>
</div>
