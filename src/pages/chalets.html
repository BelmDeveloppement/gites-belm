<!--page key=chalets title=nav.places desc=places.sub-->
<section class="pagehead">
  <div class="wrap">
    <p class="eyebrow" data-i18n="nav.places"></p>
    <h1 data-i18n="places.title"></h1>
    <p class="pagehead-sub" data-i18n="places.sub"></p>
  </div>
</section>

  <!-- CHALETS -->
  <section class="section" id="chalets">
    <div class="wrap">
      <div class="cards2">
        <article class="place" id="fresse">
          <div class="place-img" id="imgFresse" role="img" aria-label="BEL'M Amiral"></div>
          <div class="place-body">
            <p class="kicker" data-i18n="f.loc">Fresse-sur-Moselle</p>
            <h3 data-i18n="f.name">BEL'M Amiral</h3>
            <p data-i18n="f.desc"></p>
            <p class="cap" data-i18n="f.cap"></p>
            <ul class="tags"><li data-i18n="f.t1"></li><li data-i18n="f.t2"></li><li data-i18n="f.t3"></li><li data-i18n="f.t4"></li></ul>
            <p data-i18n="f.story"></p>
            <p class="small" data-i18n="f.assets"></p>
            <div class="cta-row">
              <a class="btn btn-ghost-dark" href="photos.html?site=fresse" data-i18n="places.see">Voir les photos</a>
              <a class="btn btn-primary" href="reservation.html?site=fresse" data-i18n="places.book">Réserver ce chalet</a>
            </div>
            <p class="links"><a id="rvFresseAir" target="_blank" rel="noopener" data-i18n="reviews.airbnb">Avis Airbnb</a> · <a id="rvFresseGoo" target="_blank" rel="noopener" data-i18n="reviews.google">Avis Google</a></p>
          </div>
        </article>
        <article class="place" id="bresse">
          <div class="place-img" id="imgBresse" role="img" aria-label="Gîtes BEL'M La Bresse"></div>
          <div class="place-body">
            <p class="kicker" data-i18n="b.loc">La Bresse</p>
            <h3 data-i18n="b.name">Gîtes BEL'M</h3>
            <p data-i18n="b.desc"></p>
            <p class="cap" data-i18n="b.cap"></p>
            <ul class="tags"><li data-i18n="b.t1"></li><li data-i18n="b.t2"></li><li data-i18n="b.t3"></li><li data-i18n="b.t4"></li></ul>
            <p data-i18n="b.story"></p>
            <p class="small" data-i18n="b.assets"></p>
            <div class="cta-row">
              <a class="btn btn-ghost-dark" href="photos.html?site=bresse" data-i18n="places.see">Voir les photos</a>
              <a class="btn btn-primary" href="reservation.html?site=bresse" data-i18n="places.book">Réserver ce chalet</a>
            </div>
            <p class="links"><a id="rvBresseAir" target="_blank" rel="noopener" data-i18n="reviews.airbnb">Avis Airbnb</a> · <a id="rvBresseGoo" target="_blank" rel="noopener" data-i18n="reviews.google">Avis Google</a></p>
          </div>
        </article>
      </div>

      <div class="units">
        <h3 data-i18n="units.title">Les 4 logements de La Bresse</h3>
        <div class="units-grid">
          <div class="unit"><b data-i18n="u.m1">BEL'M 1</b><span data-i18n="u.m1d"></span></div>
          <div class="unit"><b data-i18n="u.m2">BEL'M 2</b><span data-i18n="u.m2d"></span></div>
          <div class="unit"><b data-i18n="u.m3">BEL'M 3</b><span data-i18n="u.m3d"></span></div>
          <div class="unit"><b data-i18n="u.m4">BEL'M 4</b><span data-i18n="u.m4d"></span></div>
        </div>
        <p class="note" data-i18n="units.note"></p>
      </div>
    </div>
  </section>


  {{CTA}}
