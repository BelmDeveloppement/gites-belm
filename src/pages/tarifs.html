<!--page key=tarifs title=nav.rates desc=rates.sub-->
<section class="pagehead">
  <div class="wrap">
    <p class="eyebrow" data-i18n="nav.rates"></p>
    <h1 data-i18n="rates.title"></h1>
    <p class="pagehead-sub" data-i18n="rates.sub"></p>
  </div>
</section>

  <!-- TARIFS -->
  <section class="section" id="tarifs">
    <div class="wrap">
      <div class="cards2 rates">
        <div class="rate-card">
          <h3 data-i18n="rates.bresse">La Bresse</h3>
          <p class="small" data-i18n="rates.min2"></p>
          <div class="table-wrap"><table class="rtable" id="rateTable">
            <thead><tr><th></th><th data-i18n="rates.low"></th><th data-i18n="rates.mid"></th><th data-i18n="rates.high"></th></tr></thead>
            <tbody></tbody>
          </table></div>
          <p class="small"><span class="sw"></span> <span data-i18n="rates.wk">semaine</span> / <span data-i18n="rates.we">week-end / férié</span></p>
          <p class="small"><b data-i18n="rates.entire">Chalet entier</b> : 350–500 € · <span data-i18n="rates.degressive"></span></p>
          <p class="small" data-i18n="rates.linen"></p>
          <p class="small" data-i18n="rates.tax"></p>
        </div>
        <div class="rate-card">
          <h3 data-i18n="rates.fresse">Fresse-sur-Moselle</h3>
          <p class="small" data-i18n="rates.min3"></p>
          <p class="big-price" data-i18n="rates.fresseRange">De 480 € à 800 € / nuit</p>
          <p class="small">+ <span data-i18n="rates.cleaning"></span> : 270 €</p>
          <p class="small" data-i18n="rates.linen"></p>
          <p class="small" data-i18n="rates.tax"></p>
        </div>
      </div>
      <div class="rate-notes">
        <p data-i18n="rates.disc"></p>
      </div>
      <h3 class="opt-title" data-i18n="rates.options">Options</h3>
      <ul class="opts">
        <li data-i18n="o.sauna"></li><li data-i18n="o.relax"></li><li data-i18n="o.bike"></li><li data-i18n="o.sled"></li>
        <li data-i18n="o.snow"></li><li data-i18n="o.bbq"></li><li data-i18n="o.wood"></li>
      </ul>
    </div>
  </section>


  {{CTA}}
